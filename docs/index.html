<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sabr">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Eating window and satiety tracker.">
<title>Sabr</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/strip-hash.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <main id="view" class="screen" aria-busy="true">
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-title"></div>
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-line"></div>
    <div class="skeleton sk-block"></div>
    <div class="skeleton sk-line"></div>
  </main>
  <nav id="tabbar" class="tabbar" aria-label="Sections">
    <div class="tabs">
      <button class="tab" type="button" data-tab="today"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></svg><span>Today</span></button>
      <button class="tab" type="button" data-tab="week"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="15" rx="4"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Week</span></button>
      <button class="tab" type="button" data-tab="satiety"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0zM9 7.5c0-2 2-2 2-4M14 7.5c0-2 2-2 2-4"/></svg><span>Satiety</span></button>
      <button class="tab" type="button" data-tab="history"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 20v-8M10 20V6M15 20v-9M20 20V9"/></svg><span>History</span></button>
      <button class="tab" type="button" data-tab="more"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg><span>More</span></button>
    </div>
  </nav>
  <div id="sheet-root" class="sheet-root" hidden></div>
</div>
</body>
</html>
